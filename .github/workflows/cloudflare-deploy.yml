name: Build Android App & Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Cloudflare Pages Artifacts
        run: |
          mkdir -p dist
          # Copy static landing website
          cp -r public/* dist/
          # Copy compiled APK into the distribution root
          cp app/build/outputs/apk/debug/app-debug.apk dist/montra-app.apk
          echo "Build completed. Artifacts prepared in dist/"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=montra-app
